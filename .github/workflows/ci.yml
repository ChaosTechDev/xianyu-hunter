name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同一分支的重复推送取消上一次未完成的运行，节省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: 后端测试 (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # 只装 Python 包即可：依赖浏览器的用例已用 pytest.importorskip("playwright")
      # 兜底，缺少浏览器二进制时会 skip 而不是 error。
      - name: 显示环境信息
        run: |
          python --version
          python -m pytest --version

      - name: 运行测试（排除 live 联网用例）
        env:
          PYTHONIOENCODING: utf-8
          # 测试内已用 tmp_path 隔离数据库，这里再兜底一次，避免污染仓库 data/
          APP_DATABASE_FILE: ${{ runner.temp }}/ci-app.sqlite3
        run: |
          python -m pytest -m "not live and not live_slow" \
            --cov=src --cov-report=term-missing --cov-report=xml \
            -q

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: 前端构建 (Vue3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 自包含仓库可能不带 web-ui，缺失时跳过后续步骤而不是失败。
      #
      # ⚠️ 这里刻意**不用** job 级的 `if: ${{ hashFiles('web-ui/package.json') != '' }}`：
      # hashFiles() 只在 step 级上下文可用，写在 jobs.<job_id>.if 里会让整个工作流
      # 在编译期被 GitHub 拒绝 —— 表现为 run 秒失败、jobs 数为 0、run 名字退化成
      # 文件路径而不是工作流的 name。检测逻辑因此下移到 step 里，
      # 用 $GITHUB_OUTPUT 把结果传给后续步骤（issue/PR 里看不出编译错误，只能靠这些迹象判断）。
      - name: 检测 web-ui 是否存在
        id: detect
        run: |
          if [ -f web-ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web-ui/ 不存在，跳过前端构建"
          fi

      - name: 安装 Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: 安装前端依赖
        if: steps.detect.outputs.present == 'true'
        working-directory: web-ui
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 构建前端
        if: steps.detect.outputs.present == 'true'
        working-directory: web-ui
        run: npm run build

      - name: 校验构建产物落在仓库根 dist/
        if: steps.detect.outputs.present == 'true'
        run: |
          # vite.config.ts 配置 build.outDir = ../dist，与后端静态托管路径一致。
          # 这里显式断言，避免有人改动 outDir 后前端产物静默丢失。
          test -f dist/index.html || {
            echo "::error::未在仓库根 dist/ 找到 index.html，构建输出路径可能已被改动"
            exit 1
          }

  compose-config:
    name: Compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 docker-compose.yml 语法
        run: |
          # --quiet 失败即非零退出；不启动任何容器，只做解析与插值校验。
          # 若 compose 引用了 .env 中的必填变量，用示例文件兜底。
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          docker compose config --quiet
